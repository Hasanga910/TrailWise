name: Mobile CI

on:
  pull_request:
    branches: [main]
    paths:
      - "frontend-mobile/**"
      - ".github/workflows/mobile-ci.yml"
  push:
    branches: [main]
    paths:
      - "frontend-mobile/**"
      - ".github/workflows/mobile-ci.yml"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
      - name: Get dependencies
        run: flutter pub get
        working-directory: frontend-mobile
      - name: Analyze
        run: flutter analyze
        working-directory: frontend-mobile
      - name: Test
        run: flutter test
        working-directory: frontend-mobile
