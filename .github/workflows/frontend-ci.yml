name: Frontend CI

on:
  pull_request:
    branches: [main]
    paths:
      - "frontend-web/**"
      - ".github/workflows/frontend-ci.yml"
  push:
    branches: [main]
    paths:
      - "frontend-web/**"
      - ".github/workflows/frontend-ci.yml"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend-web/package-lock.json
      - name: Install
        run: npm ci
        working-directory: frontend-web
      - name: Lint
        run: npm run lint
        working-directory: frontend-web
      - name: Test
        run: npm run test
        working-directory: frontend-web
      - name: Build
        run: npm run build
        working-directory: frontend-web
