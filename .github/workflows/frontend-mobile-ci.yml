name: Frontend Mobile CI

on:
  pull_request:
    branches: [main]
    paths:
      - "frontend-mobile/**"
      - ".github/workflows/frontend-mobile-ci.yml"
  push:
    branches: [main]
    paths:
      - "frontend-mobile/**"
      - ".github/workflows/frontend-mobile-ci.yml"

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get
        working-directory: frontend-mobile

      - name: Analyze
        run: flutter analyze
        working-directory: frontend-mobile

      - name: Test
        run: flutter test
        working-directory: frontend-mobile
